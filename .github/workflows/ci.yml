name: CI

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python3 -m pip install ruff==0.15.12

      - name: Run ruff
        run: ruff check .

  deps-audit:
    name: Dependencies audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python3 -m pip install pip-audit==2.10.0

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python3 -m pip install bandit==1.7.9

      - name: Run Bandit
        run: bandit -r config/ apps/ -ll && bandit manage.py -ll

  unit-test:
    name: Unit testing
    runs-on: ubuntu-24.04
    needs: [lint, deps-audit, sast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run pytest
        run: pytest --tb=short -q
