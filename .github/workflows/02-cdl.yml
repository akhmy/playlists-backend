name: CDL

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  create-package:
    name: Create GitHub Package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{github.repository_owner}}/playlists-backend:latest
            ghcr.io/${{github.repository_owner}}/playlists-backend:${{ github.sha }}
